<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#13294B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ポジション整理"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><title>ポジション整理 2026｜都立大サッカー部</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style id="css">
:root{--red:#C9302C;--bg:#EEF2F7;--surface:#FFFFFF;--ink:#14202E;--sub:#5B6B7E;--line:#D5DDE7;--navy:#13294B;--blue:#1F5FBF;--pitch:#14305A;--pitch-line:rgba(255,255,255,.22);--ok:#23885C;--warn:#B98510;--short:#C93C34;--chip:#E3EAF3;--sel:#DCE8FA;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1520;--surface:#162130;--ink:#E5ECF4;--sub:#93A3B6;--line:#273548;--navy:#0B1A30;--blue:#6FA2EE;--pitch:#102746;--ok:#45B985;--warn:#E0B13E;--short:#EE6A61;--red:#E8574F;--chip:#203047;--sel:#1E3354;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1520;--surface:#162130;--ink:#E5ECF4;--sub:#93A3B6;--line:#273548;--navy:#0B1A30;--blue:#6FA2EE;--pitch:#102746;--ok:#45B985;--warn:#E0B13E;--short:#EE6A61;--red:#E8574F;--chip:#203047;--sel:#1E3354;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.55;padding-bottom:84px}
.num{font-family:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:var(--navy);color:#fff;padding:18px 0 16px}
header h1{margin:0;font-size:21px;letter-spacing:.02em}
header p{margin:2px 0 12px;color:rgba(255,255,255,.72);font-size:13px}
.sys{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.sys button{border:0;background:transparent;color:rgba(255,255,255,.8);font:inherit;font-size:17px;padding:5px 16px;border-radius:999px;cursor:pointer}
.sys button.on{background:#fff;color:var(--navy)}
.pitch{position:relative;background:var(--pitch);aspect-ratio:68/72;max-height:520px;margin:14px auto 0;border-radius:6px;overflow:hidden;width:100%}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:2.5px solid var(--st);background:rgba(8,18,34,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit;padding:0}
.slot b{font-size:14px;line-height:1}
.slot span{font-size:12px;opacity:.85;line-height:1.2;margin-top:2px}
.slot.sel{box-shadow:0 0 0 4px rgba(255,255,255,.55)}
.st-ok{--st:var(--ok)}.st-warn{--st:var(--warn)}.st-short{--st:var(--short)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
section{margin-top:22px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.depth{padding:12px 14px}
.depth h3{margin:0 0 6px;font-size:15px}
.depth .row{display:flex;gap:8px;margin-top:4px;font-size:14px}
.depth .row em{font-style:normal;color:var(--sub);flex:0 0 34px}
.depth .names{flex:1}
.depth .names span{display:inline-block;margin:0 10px 2px 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:330px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:400;color:var(--sub);font-size:12px}
td:first-child,th:first-child{text-align:left;padding-left:12px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr.sel{background:var(--sel)}
.bar{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--st);margin-right:6px;vertical-align:2px}
.tot small{color:var(--sub);font-size:11px}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:10px}
.meta b{color:var(--ink);font-size:17px;margin-left:3px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-size:13px;padding:4px 12px;cursor:pointer}
.filters button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist li.out{opacity:.5}
.no{font-size:26px;line-height:1;color:var(--blue);text-align:right;padding-top:2px}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who strong{font-size:16px}
.who small{color:var(--sub);font-size:12px}
.tag{font-size:11px;border-radius:4px;padding:0 5px;background:var(--chip);color:var(--sub)}
.pick{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-width:70px}
select.empty{color:var(--sub)}
select.bad{border-color:var(--short)}
.outbtn{margin-left:auto;font-size:12px;color:var(--sub);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:inherit;cursor:pointer}
.outbtn.on{color:var(--short);border-color:var(--short)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.savebar p{margin:0;flex:1;font-size:13px;color:var(--sub)}
.savebar button{border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:9px 22px;border-radius:8px;cursor:pointer}
.savebar button:disabled{opacity:.4;cursor:default}
.scope{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--sub)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:5px 14px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--blue);color:#fff}
.teamseg button{padding:3px 11px;font-size:14px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.teamseg button.on.tA{background:var(--blue)}
.teamseg button.on.tB{background:var(--sub)}
.tb{display:inline-block;font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;line-height:16px;width:16px;text-align:center;border-radius:3px;color:#fff;margin-right:3px;vertical-align:1px}
.tb.A{background:var(--blue)}.tb.B{background:var(--sub)}.tb.N{background:var(--line);color:var(--sub)}
.delbtn{font-size:12px;color:var(--short);background:none;border:0;font-family:inherit;cursor:pointer;padding:4px}
.addbox{padding:12px 14px;border-top:1px solid var(--line)}
.addbox .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbox label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.addbox input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.addbox .wide{grid-column:1/-1}
.addbox .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:7px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
.err{color:var(--short);font-size:12px;margin:6px 0 0}
.mact{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn.sm{font-size:12px;padding:4px 10px;font-weight:400}
.scope .btn.sm{margin-left:auto}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mtabs button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mtabs button b{font-size:17px}
.mtabs button span{font-size:12px;color:var(--sub)}
.mtabs button.side-R b{color:var(--red)}
.mtabs button.on.side-R{border-color:var(--red)}
.mtabs button.on.side-W{border-color:var(--ink)}
.mpitch.side-R{box-shadow:inset 0 4px 0 var(--red)}
.mpitch.side-W{box-shadow:inset 0 4px 0 #fff}
.mslot{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-style:dashed;background:rgba(8,18,34,.75);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;padding:0 2px;cursor:pointer}
.mslot em{font-style:normal;font-size:10px;opacity:.75;line-height:1.1}
.mslot b{font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.mslot.f1{border:3px solid var(--ok)}.mslot.f2{border:3px solid var(--warn)}.mslot.f0{border:3px solid var(--short)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.mchip small{color:var(--sub);font-size:11px;margin-left:4px}
.mtext{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(5,12,24,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:80vh;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:17px}
.slist{overflow-y:auto;flex:1;margin:0 -14px;padding:0 14px}
.slist h4{margin:10px 0 4px;font-size:12px;color:var(--sub);font-weight:400}
.prow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:15px;padding:9px 2px;text-align:left;cursor:pointer}
.prow small{color:var(--sub);font-size:12px}
.prow em{font-style:normal;font-size:12px;color:var(--sub);flex:0 0 auto}
.prow em.free{color:var(--ok)}
.prow.cur{background:var(--sel)}
.prow input{width:20px;height:20px;flex:0 0 auto}
.sfoot,.sacts{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
.sys button[data-tab]{font-size:14px;padding:6px 16px}
.ginfo{padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ginfo label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.ginfo input,.pmin input,.subform select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.gnum{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.gnum b{color:var(--ink);font-size:18px}
.gnum .gsub{margin-left:auto}
.gnum .btn.sm{margin:0;min-width:34px}
.ptabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.ptabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.ptabs button small{font-size:11px;color:var(--sub)}
.ptabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ptabs button.on small{color:rgba(255,255,255,.8)}
.pset{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.pset .scope{margin:0}
.pmin{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.pmin input{width:64px}
.subin{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;background:var(--warn);color:#111;border-radius:3px;padding:0 4px;white-space:nowrap;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.shead2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.shead2 h2{margin:0}
.btn:disabled{opacity:.4;cursor:default}
.sublist{list-style:none;margin:0;padding:0}
.sublist li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.sublist li:last-child{border-bottom:0}
.sublist li b{font-size:18px;min-width:34px;color:var(--blue)}
.sublist li span{flex:1}
.sublist li span i{font-style:normal;color:var(--sub);margin:0 6px}
.sublist li span small{color:var(--sub);font-size:11px;margin-left:6px}
.sublist li.bad{background:color-mix(in srgb,var(--short) 12%,transparent)}
.sublist li.bad b{color:var(--short)}
.subform{display:flex;flex-direction:column;gap:12px}
.subform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.ttbl td:first-child{min-width:130px}
.ttbl td{font-size:14px}
.ttbl .tn{display:flex;align-items:baseline;gap:6px}
.ttbl .tn small{color:var(--sub);font-size:11px}
.tbar{position:relative;height:5px;background:var(--chip);border-radius:3px;margin-top:4px}
.tbar span{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.tbar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.ttbl tr.zero td:first-child .tn{color:var(--short)}
.ttbl td.dim{color:var(--sub)}
.plist li.inj .who strong{color:var(--short)}
.injbtn.on{background:var(--short);border-color:var(--short);color:#fff}
.injtag{font-style:normal;font-size:10px;background:var(--short);color:#fff;border-radius:3px;padding:0 4px;margin-left:4px;line-height:16px}
.mslot.inj{border-color:var(--short);border-style:dotted;opacity:.85}
.mslot.inj::after{content:"ケガ";position:absolute;top:-8px;right:-4px;font-size:10px;background:var(--short);color:#fff;border-radius:3px;padding:0 4px}
.prow.inj{color:var(--sub);cursor:default}
.injbtn+.outbtn{margin-left:0}
.bkrow{display:flex;align-items:center;gap:8px;padding:6px 0}
.bkrow input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:70px}
.bkrow span{font-size:14px;color:var(--sub)}
.gnum .btn.sm#g_bulk{margin-left:auto}
.prevbox{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.prevbox summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:15px}
.prevp{padding:4px 0 8px;border-top:1px solid var(--line)}
.prevp h4{margin:6px 0;font-size:12px;color:var(--sub);font-weight:400}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{display:inline-flex;align-items:baseline;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--bg)}
.pchip em{font-style:normal;font-size:10px;color:var(--sub)}
.pchip small{font-size:11px;color:var(--warn)}
.pchip.now{border:2px solid var(--blue);padding:1px 6px}
.tl{margin:4px 0 10px}
.tbarw{position:relative;height:34px;background:var(--chip);border-radius:6px;overflow:hidden}
.tseg{position:absolute;top:0;bottom:0;border:0;border-right:2px solid var(--surface);background:color-mix(in srgb,var(--blue) 35%,var(--chip));color:var(--ink);font:inherit;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px}
.tseg.alt{background:color-mix(in srgb,var(--blue) 20%,var(--chip))}
.tseg.on{background:var(--blue);color:#fff}
.tline{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--ink);opacity:.55;pointer-events:none}
.tlabels{position:relative;height:30px}
.tlabels span{position:absolute;top:2px;text-align:center;font-size:11px;color:var(--sub);line-height:1.2;display:flex;flex-direction:column}
.tlabels small{font-size:10px}
.seglist{display:flex;flex-direction:column;gap:6px}
.seglist button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;padding:8px 12px;cursor:pointer;text-align:left}
.seglist button b{font-size:18px;color:var(--blue);min-width:18px;text-align:center}
.seglist button span{flex:1}
.seglist button small{color:var(--sub);font-size:13px}
.seglist button.on{border:2px solid var(--blue);background:var(--sel);padding:7px 11px}
.segedit{border-top:3px solid var(--blue);padding-top:12px}
.seghead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.seghead b{font-size:18px;margin-right:8px}
.seghead span{font-size:14px}
.diffc{padding:10px 14px;margin-top:10px}
.diffc h3{margin:0 0 6px;font-size:14px}
.diffc p{margin:4px 0;font-size:14px}
.diffc small{color:var(--sub);font-size:11px;margin:0 4px 0 2px}
.diffc b{display:inline-block;font-size:11px;color:#fff;border-radius:3px;padding:0 5px;margin-right:8px;font-weight:700}
.din{background:var(--ok)}.dout{background:var(--short)}.dmv{background:var(--sub)}
.alertbox{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.alertbox summary{cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none}
.alertbox summary::-webkit-details-marker{display:none}
.alertbox summary b{font-size:15px;margin-right:4px}
.ab{font-size:12px;border-radius:999px;padding:1px 9px;color:#fff;font-weight:700}
.ab.red{background:var(--short)}.ab.warn{background:var(--warn);color:#111}.ab.info{background:var(--sub)}.ab.ok{background:var(--ok)}
.alim{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:2px 0 10px;border-top:1px solid var(--line);padding-top:10px}
.alim input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:70px}
.alist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.alist li{min-width:0}
.alist li>button,.alist li>div{box-sizing:border-box;max-width:100%;display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);cursor:pointer}
.alist li>div{cursor:default}
.alist i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px}
.alist li.red i{background:var(--short)}.alist li.warn i{background:var(--warn)}.alist li.info i{background:var(--sub)}
.alist li.red>button{background:color-mix(in srgb,var(--short) 10%,var(--bg))}
.seglist button.al-red{border-left:5px solid var(--short)}
.seglist button.al-warn{border-left:5px solid var(--warn)}
.ttbl td.over b{color:var(--short)}
.owarn{color:var(--short);font-weight:700;margin-left:6px;font-size:11px}

</style></head><body>
<div id="root"></div>
<script id="app">
(function(){
const HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ポジション整理 2026｜都立大サッカー部</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">';
const POS=['GK','CB','HB','WB','CM','AM','CF'];
const SYS={
  '3421':{label:'3-4-2-1',slots:{GK:1,CB:1,HB:2,WB:2,CM:2,AM:2,CF:1},xy:[['CF',50,13],['AM',32,30],['AM',68,30],['WB',11,50],['CM',37,53],['CM',63,53],['WB',89,50],['HB',22,73],['CB',50,76],['HB',78,73],['GK',50,92]]},
  '3412':{label:'3-4-1-2',slots:{GK:1,CB:1,HB:2,WB:2,CM:2,AM:1,CF:2},xy:[['CF',35,13],['CF',65,13],['AM',50,31],['WB',11,50],['CM',37,53],['CM',63,53],['WB',89,50],['HB',22,73],['CB',50,76],['HB',78,73],['GK',50,92]]}
};
const KEY='tmu-pos-draft';
const DATA_KEY='tmu-pos-data';
const EMPTY={rev:1,system:'3421',players:[],games:[]};
let saved=null;try{saved=JSON.parse(localStorage.getItem(DATA_KEY)||'null')}catch(e){saved=null}
if(!saved||!Array.isArray(saved.players))saved=JSON.parse(JSON.stringify(EMPTY));
let lastSaved=null;
let state=JSON.parse(JSON.stringify(saved));
let dirty=false, sel=null, filter='all', scope='all', canSave=null, adding=false;
let tab='pos';try{tab=sessionStorage.getItem('tmu-tab')||'pos'}catch(e){}

function migrate(st){st.players.forEach(p=>{if(!p.id)p.id=p.no!=null&&p.no!==''?'n'+p.no:'p'+Math.random().toString(36).slice(2,9);if(p.team===undefined)p.team='';delete p.staff;});}
migrate(state);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasNo=p=>p.no!==null&&p.no!==''&&p.no!==undefined;
function inScope(p){return !p.out&&!p.inj&&(scope==='all'||p.team===scope)}
function pool(){return state.players.filter(inScope)}
function stats(){
  const sys=SYS[state.system],r={},team=scope!=='all';
  POS.forEach(k=>{const s=sys.slots[k];const f=pool().filter(p=>p.p1===k);const sc=pool().filter(p=>p.p2===k);
    const g=[0,0,0,0,0];f.forEach(p=>g[p.grade]=(g[p.grade]||0)+1);
    const tot=f.length+sc.length;let st='ok',target;
    if(team){target=s*2;if(tot<s)st='short';else if(f.length<s||tot<s*2)st='warn';}
    else{target=s*3;if(f.length<s||tot<s*2)st='short';else if(f.length<s*2||tot<s*3)st='warn';}
    r[k]={slots:s,first:f,second:sc,tot,g,st,target};});
  return r;
}
function shell(){
  $('#root').innerHTML=`
<header><div class="wrap"><h1>ポジション整理 2026</h1><p>東京都立大学サッカー部　ポジション整理と練習試合のメンバー管理</p>
<div class="sys" role="tablist">${[['pos','ポジション'],['game','練習試合']].map(([k,l])=>`<button role="tab" data-tab="${k}">${l}</button>`).join('')}</div></div></header>
<div class="wrap" id="posview">
<div class="scope"><span>システム</span><div class="seg">${['3421','3412'].map(k=>`<button class="num" data-sys="${k}">${SYS[k].label}</button>`).join('')}</div></div>
<div class="scope"><span>集計対象</span><div class="seg" id="scope">${[['all','全体'],['A','Aチーム'],['B','Bチーム']].map(([k,l])=>`<button data-scope="${k}">${l}</button>`).join('')}</div></div>
<div class="pitch" id="pitch"><svg viewBox="0 0 68 72" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="var(--pitch-line)" stroke-width=".35"><rect x="2" y="2" width="64" height="68"/><line x1="2" y1="2" x2="66" y2="2"/><circle cx="34" cy="2" r="9.15"/><rect x="13.85" y="53.5" width="40.3" height="16.5"/><rect x="24.85" y="64.5" width="18.3" height="5.5"/><path d="M26.7 53.5 A9.15 9.15 0 0 1 41.3 53.5"/></g></svg><div id="slots"></div></div>
<div class="legend"><span><i style="background:var(--ok)"></i>十分</span><span><i style="background:var(--warn)"></i>やや不足</span><span><i style="background:var(--short)"></i>不足</span><span>数字＝1st人数／1st＋2nd合計</span></div>
<div id="depth"></div>
<section><h2 id="baltitle">人数バランス</h2><div class="card tbl"><table><thead><tr><th>ポジ</th><th>枠</th><th>1st</th><th>2nd</th><th>計／目安</th><th>1年</th><th>2年</th><th>3年</th><th>4年</th></tr></thead><tbody id="tbody"></tbody></table></div>
<p class="note" id="balnote"></p><div class="mact"><button class="btn ghost" id="pos_img">ポジション別メンバーを画像で出力</button></div></section>
<section><h2>選手</h2><div class="meta" id="meta"></div><div class="filters" id="filters"></div><div class="card"><ul class="plist" id="plist"></ul><div id="addarea"></div></div></section>
</div>
<div class="wrap" id="gameview" hidden></div>
<div class="savebar"><div class="wrap"><p id="savemsg"></p><button id="savebtn">データ</button></div></div>`;
  document.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>{state.system=b.dataset.sys;touch();renderTop();});
  document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;renderTop();renderList();});
  $('#savebtn').onclick=save;
  $('#pos_img').onclick=()=>showImage(posImage,'ポジション別メンバー.png');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
}
function setTab(t){tab=t;try{sessionStorage.setItem('tmu-tab',t)}catch(e){}document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',b.dataset.tab===t);});$('#posview').hidden=t!=='pos';$('#gameview').hidden=t!=='game';if(t==='game')renderGame();else{renderTop();renderList();}window.scrollTo(0,0);}
function renderTop(){
  const st=stats(),sys=SYS[state.system];
  document.querySelectorAll('[data-sys]').forEach(b=>b.classList.toggle('on',b.dataset.sys===state.system));
  document.querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('on',b.dataset.scope===scope));
  $('#slots').innerHTML=sys.xy.map(([k,x,y])=>{const s=st[k];return `<button class="slot st-${s.st}${sel===k?' sel':''}" style="left:${x}%;top:${y}%" data-pos="${k}" aria-label="${k} 1st ${s.first.length}人 合計${s.tot}人"><b>${k}</b><span class="num">${s.first.length}／${s.tot}</span></button>`}).join('');
  document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>pick(b.dataset.pos));
  $('#baltitle').textContent='人数バランス（'+(scope==='all'?'全体':scope+'チーム')+'）';
  $('#tbody').innerHTML=POS.map(k=>{const s=st[k];return `<tr data-pos="${k}" class="${sel===k?'sel':''} st-${s.st}"><td><span class="bar"></span>${k}</td><td class="num">${s.slots}</td><td class="num">${s.first.length}</td><td class="num">${s.second.length}</td><td class="tot"><span class="num">${s.tot}</span> <small>／${s.target}</small></td>${[1,2,3,4].map(g=>`<td class="num">${s.g[g]||0}</td>`).join('')}</tr>`}).join('');
  document.querySelectorAll('#tbody tr').forEach(r=>r.onclick=()=>pick(r.dataset.pos));
  $('#balnote').textContent=scope==='all'
    ?'目安（全体）：1st は枠×2人、1st＋2nd は枠×3人。学年は 1st の内訳です。「対象外」の選手は数えません。'
    :'目安（チーム単位）：1st は枠と同数、1st＋2nd は枠×2人。学年は 1st の内訳です。';
  const d=$('#depth');
  if(sel){const s=st[sel];const nm=a=>a.length?a.map(p=>`<span>${scope==='all'?`<i class="tb ${p.team||'N'}">${p.team||'－'}</i>`:''}${esc(p.name)}<small class="num" style="color:var(--sub)"> ${p.grade}年</small></span>`).join(''):'<span style="color:var(--sub)">なし</span>';
    d.innerHTML=`<div class="card depth" style="margin-top:12px"><h3>${sel}（枠 ${s.slots}）${scope==='all'?'':'　'+scope+'チーム'}</h3><div class="row"><em>1st</em><div class="names">${nm(s.first)}</div></div><div class="row"><em>2nd</em><div class="names">${nm(s.second)}</div></div></div>`;}
  else d.innerHTML='<p class="note">ポジションをタップすると、その位置の選手一覧が出ます。</p>';
  const a=state.players.filter(p=>!p.out&&!p.inj);
  const c=t=>a.filter(p=>p.team===t).length;
  $('#meta').innerHTML=`<span>対象<b class="num">${a.length}</b>人</span><span>A<b class="num">${c('A')}</b>人</span><span>B<b class="num">${c('B')}</b>人</span><span>チーム未分類<b class="num">${c('')}</b>人</span><span>1st未入力<b class="num">${a.filter(p=>!p.p1).length}</b>人</span><span>ケガ<b class="num" style="color:var(--short)">${state.players.filter(p=>!p.out&&p.inj).length}</b>人</span><span>対象外<b class="num">${state.players.filter(p=>p.out).length}</b>人</span>`;
  renderFilters();
  renderSave();
}
function pick(k){sel=sel===k?null:k;filter=sel||'all';renderTop();renderList();}
function renderFilters(){
  const opts=[['all','全員'],['todo','未入力あり'],['noteam','チーム未分類'],['inj','ケガ'],...POS.map(k=>[k,k])];
  $('#filters').innerHTML=opts.map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;sel=POS.includes(filter)?filter:null;renderTop();renderList();});
}
function opt(cur,ph){return `<option value="">${ph}</option>`+POS.map(k=>`<option value="${k}"${k===cur?' selected':''}>${k}</option>`).join('')}
function sortP(a,b){const an=hasNo(a)?+a.no:1e9,bn=hasNo(b)?+b.no:1e9;return an-bn||String(a.name).localeCompare(String(b.name),'ja')}
function renderList(){
  let ps=state.players.slice().sort(sortP);
  if(scope!=='all')ps=ps.filter(p=>p.team===scope);
  if(filter==='todo')ps=ps.filter(p=>!p.out&&(!p.p1||!p.p2||!p.team));
  else if(filter==='noteam')ps=ps.filter(p=>!p.out&&!p.team);
  else if(filter==='inj')ps=ps.filter(p=>p.inj);
  else if(POS.includes(filter))ps=ps.filter(p=>p.p1===filter||p.p2===filter).sort((a,b)=>(a.p1===filter?0:1)-(b.p1===filter?0:1)||sortP(a,b));
  if(!ps.length){$('#plist').innerHTML=state.players.length?'<li style="display:block;color:var(--sub)">該当する選手はいません。</li>':'<li style="display:block;color:var(--sub)">まだ選手がいません。下の「データ」からデータを読み込むか、「選手を追加」から登録してください。</li>';}
  else $('#plist').innerHTML=ps.map(p=>{
    const info=[p.grade?p.grade+'年':'',p.reg?'登録'+p.reg:'',p.h?p.h+'cm':''].filter(Boolean).join('　');
    return `<li data-id="${esc(p.id)}" class="${p.out?'out':''}${p.inj?' inj':''}"><div class="no num">${hasNo(p)?esc(p.no):'－'}</div><div><div class="who"><strong>${esc(p.name)}</strong><small>${esc(info)}</small>${p.added?`<button class="delbtn" data-del>削除</button>`:''}</div></div>
<div class="pick"><div class="seg teamseg" aria-label="チーム"><button data-team="A" class="tA${p.team==='A'?' on':''}">A</button><button data-team="B" class="tB${p.team==='B'?' on':''}">B</button></div><label>1st<select data-k="p1" class="${p.p1?'':'empty'}">${opt(p.p1,'未定')}</select></label><label>2nd<select data-k="p2" class="${p.p2?'':'empty'}${p.p2&&p.p2===p.p1?' bad':''}">${opt(p.p2,'なし')}</select></label><button class="outbtn injbtn${p.inj?' on':''}" data-inj>${p.inj?'ケガ中':'ケガ'}</button><button class="outbtn${p.out?' on':''}" data-out>${p.out?'対象外':'対象'}</button></div></li>`}).join('');
  document.querySelectorAll('#plist li[data-id]').forEach(li=>{
    const p=state.players.find(x=>x.id===li.dataset.id);
    li.querySelectorAll('select').forEach(s=>s.onchange=()=>{p[s.dataset.k]=s.value;touch();
      const [s1,s2]=li.querySelectorAll('select');s1.classList.toggle('empty',!p.p1);s2.classList.toggle('empty',!p.p2);s2.classList.toggle('bad',!!p.p2&&p.p2===p.p1);renderTop();});
    li.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{p.team=p.team===b.dataset.team?'':b.dataset.team;touch();
      li.querySelectorAll('[data-team]').forEach(x=>x.classList.toggle('on',x.dataset.team===p.team));renderTop();});
    li.querySelector('[data-out]').onclick=e=>{p.out=!p.out;touch();li.classList.toggle('out',p.out);e.target.classList.toggle('on',p.out);e.target.textContent=p.out?'対象外':'対象';renderTop();};
    li.querySelector('[data-inj]').onclick=e=>{p.inj=!p.inj;touch();li.classList.toggle('inj',p.inj);e.target.classList.toggle('on',p.inj);e.target.textContent=p.inj?'ケガ中':'ケガ';renderTop();};
    const del=li.querySelector('[data-del]');
    if(del)del.onclick=async()=>{if(!await ask(p.name+' を一覧から削除しますか？'))return;state.players=state.players.filter(x=>x.id!==p.id);touch();renderTop();renderList();};
  });
  renderAdd();
}
function renderAdd(){
  const a=$('#addarea');
  if(!adding){a.innerHTML='<div class="addbox" style="text-align:center"><button class="btn ghost" id="openadd">＋ 選手を追加</button></div>';$('#openadd').onclick=()=>{adding=true;renderAdd();$('#f_name').focus();};return;}
  a.innerHTML=`<div class="addbox"><div class="grid">
<label class="wide">氏名（必須）<input id="f_name" autocomplete="off" placeholder="例：伊藤 優汰"></label>
<label>背番号<input id="f_no" inputmode="numeric" autocomplete="off"></label>
<label>学年<select id="f_grade"><option value="">－</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<label>登録ポジション<select id="f_reg"><option value="">－</option><option>GK</option><option>DF</option><option>MF</option><option>FW</option></select></label>
<label>身長（cm）<input id="f_h" inputmode="numeric" autocomplete="off"></label>
<label>チーム<select id="f_team"><option value="">未分類</option><option>A</option><option>B</option></select></label>
<label>1st<select id="f_p1">${opt('','未定')}</select></label>
</div><p class="err" id="f_err"></p><div class="acts"><button class="btn ghost" id="f_cancel">やめる</button><button class="btn" id="f_ok">追加する</button></div></div>`;
  $('#f_cancel').onclick=()=>{adding=false;renderAdd();};
  $('#f_ok').onclick=()=>{
    const name=$('#f_name').value.trim(),no=$('#f_no').value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)),h=$('#f_h').value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
    if(!name){$('#f_err').textContent='氏名を入力してください。';return;}
    if(no&&!/^\d+$/.test(no)){$('#f_err').textContent='背番号は数字で入力してください。';return;}
    if(no&&state.players.some(p=>hasNo(p)&&String(p.no)===no)){$('#f_err').textContent='背番号 '+no+' はすでに使われています。';return;}
    state.players.push({id:'p'+Date.now().toString(36),no:no?+no:null,name,reg:$('#f_reg').value,grade:+$('#f_grade').value||0,h:/^\d+$/.test(h)?+h:0,p1:$('#f_p1').value,p2:'',out:false,team:$('#f_team').value,added:true});
    touch();adding=false;renderTop();renderList();
  };
}
function touch(){try{localStorage.setItem(DATA_KEY,JSON.stringify(state));lastSaved=new Date();dirty=false;}catch(e){dirty=true;}const m=document.getElementById('savemsg');if(m)renderSave();}
function renderSave(){
  const b=$('#savebtn'),m=$('#savemsg');if(!b||!m)return;b.disabled=false;
  m.textContent=dirty?'この端末に保存できませんでした（容量やプライベートブラウズを確認）':lastSaved?`この端末に自動保存しました（${lastSaved.getHours()}:${String(lastSaved.getMinutes()).padStart(2,'0')}）`:'入力はこの端末に自動で保存されます';
}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function save(){
  const d=modal(`<div class="shead"><b>データ</b><button class="btn ghost sm" data-x>閉じる</button></div>
<div class="slist" style="display:flex;flex-direction:column;gap:10px;padding-bottom:6px">
<p class="note" style="margin:0">データはこの端末の中だけに保存されます。ほかの人や別の端末と同じデータを使うときは、書き出したファイルを送り、相手が読み込みます。</p>
<button class="btn" id="d_exp">データを書き出す（共有）</button>
<label class="btn ghost" style="text-align:center;cursor:pointer">データを読み込む<input type="file" id="d_imp" accept=".json,application/json" style="display:none"></label>
<p class="note" id="d_msg" style="margin:0"></p>
<button class="btn ghost sm" id="d_clear" style="border-color:var(--short);color:var(--short);align-self:flex-start">この端末のデータを消す</button></div>`);
  d.querySelector('[data-x]').onclick=closeModal;
  $('#d_exp').onclick=async()=>{const blob=new Blob([JSON.stringify(state)],{type:'application/json'});try{const dl=await getDl();await dl.save({filename:`tmu-position-data-${stamp()}.json`,data:blob});$('#d_msg').textContent='書き出しました。LINEなどで送った相手は「データを読み込む」から取り込めます。';}catch(e){$('#d_msg').textContent=e&&e.code==='declined'?'書き出しをやめました。':'書き出せませんでした。';}};
  $('#d_imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;let obj;try{obj=JSON.parse(await f.text());}catch(er){$('#d_msg').textContent='ファイルを読み取れませんでした。';return;}
    if(!obj||!Array.isArray(obj.players)){$('#d_msg').textContent='このツールのデータではないようです。';return;}
    if(state.players.length&&!await ask(`いまのデータ（選手${state.players.length}人）を、読み込むデータ（選手${obj.players.length}人）で置き換えます。よろしいですか？`))return;
    try{localStorage.setItem(DATA_KEY,JSON.stringify(obj));}catch(er){$('#d_msg').textContent='この端末に保存できませんでした。';return;}location.reload();};
  $('#d_clear').onclick=async()=>{if(!await ask('この端末のデータをすべて消します。先に「データを書き出す」で控えをとっておくことをおすすめします。消しますか？'))return;try{localStorage.removeItem(DATA_KEY);localStorage.removeItem(KEY);}catch(er){}location.reload();};
}
// ---- 紅白戦 ----

let sgOpt={policy:'eq',aMin:60,bMin:'',timing:'half',seed:0};
function sgTargets(ps,cap,lim){
  const t={},A=ps.filter(p=>p.team==='A'),B=ps.filter(p=>p.team!=='A'),o=sgOpt;
  if(!ps.length)return t;
  if(o.policy==='eq'||!A.length||(!B.length&&o.policy==='a')){ps.forEach(p=>t[p.id]=Math.min(lim,cap/ps.length));return t;}
  let a;
  if(o.policy==='a')a=Math.min(lim,cap/A.length);else a=Math.min(lim,Math.max(0,+o.aMin||0),cap/A.length);
  A.forEach(p=>t[p.id]=a);
  const rest=Math.max(0,cap-a*A.length);
  B.forEach(p=>t[p.id]=Math.min(lim,o.policy==='set'&&o.bMin!==''?Math.max(0,+o.bMin):(B.length?rest/B.length:0)));
  return t;
}
function sgChunks(g){
  const ch=[];g.periods.forEach((pd,k)=>{let pts=[0];
    if(sgOpt.timing==='half')pts=[0,Math.floor(pd.min/2)];
    else if(sgOpt.timing==='15'){pts=[];for(let x=0;x<pd.min;x+=15)pts.push(x);}
    else if(sgOpt.timing==='third'){pts=[0,Math.round(pd.min/3),Math.round(pd.min*2/3)];}
    pts=[...new Set(pts)].filter(x=>x<pd.min).sort((a,b)=>a-b);
    pts.forEach((x,i)=>ch.push({p:k,t:x,d:(i+1<pts.length?pts[i+1]:pd.min)-x}));});
  return ch;
}
function sgPlan(g){

  const total=g.periods.reduce((a,p)=>a+p.min,0);
  const gks=ps.filter(p=>p.p1==='GK'),field=ps.filter(p=>p.p1!=='GK');
  const tgt={...sgTargets(gks,total,lim),...sgTargets(field,total*(xy.length-1),lim)};

  const order=xy.map((z,k)=>k).sort((a,b)=>{const qa=xy[a][0],qb=xy[b][0];if(qa==='GK')return -1;if(qb==='GK')return 1;return ps.filter(p=>p.p1===qa).length-ps.filter(p=>p.p1===qb).length;});

      else{const ff=cands.filter(p=>p.p1!=='GK');if(ff.length)cands=ff;}
      if(!cands.length)return;
      const sc=p=>{const need=(tgt[p.id]||0)-got[p.id];const f=fit(p,q);let s=need-(f==='f1'?0:f==='f2'?12:40);
        if(prev&&prev[k]===p.id&&need>=c.d*0.5)s+=25;if(got[p.id]+c.d>lim)s-=1000;return s+rnd()*4;};

    prev=lineup;});

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function ft(ctx,size,w,fam){ctx.font=`${w||400} ${size}px ${fam||IMG.font}`;}
function fitText(ctx,t,maxW,size,w,fam){let s=size;ft(ctx,s,w,fam);while(s>10&&ctx.measureText(t).width>maxW){s-=1;ft(ctx,s,w,fam);}return s;}
function wrapLines(ctx,text,maxW){const out=[];let cur='';for(const ch of String(text)){if(ctx.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPitch(ctx,x,y,w,h){
  ctx.fillStyle=IMG.pitch;rr(ctx,x,y,w,h,16);ctx.fill();
  ctx.strokeStyle=IMG.line;ctx.lineWidth=Math.max(2,w/320);
  const m=w*0.03;ctx.strokeRect(x+m,y+m,w-2*m,h-2*m);
  ctx.beginPath();ctx.arc(x+w/2,y+m,w*0.135,0,Math.PI);ctx.stroke();
  const bw=w*0.59,bh=h*0.23;ctx.strokeRect(x+(w-bw)/2,y+h-m-bh,bw,bh);
  const sw=w*0.27,sh=h*0.077;ctx.strokeRect(x+(w-sw)/2,y+h-m-sh,sw,sh);
  ctx.beginPath();ctx.arc(x+w/2,y+h-m-bh,w*0.105,Math.PI,0);ctx.stroke();
}
function drawLineup(ctx,seg,x,y,w,h,inSet,sn){
  drawPitch(ctx,x,y,w,h);
  const xy=SYS[seg.sys].xy;const r=Math.max(15,w*0.046);
  xy.forEach(([q,px,py],k)=>{const p=byId(seg.lineup[k]);const py2=py*0.9+(py>85?6:0);const cx=x+w*(0.05+0.9*px/100),cy=y+h*(0.05+0.9*py2/100);
    ctx.fillStyle=p?IMG.white:'rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    if(p&&inSet&&inSet.has(p.id)){ctx.lineWidth=Math.max(3,r*0.16);ctx.strokeStyle=IMG.warn;ctx.stroke();}
    ctx.fillStyle=IMG.navy;ft(ctx,Math.round(r*0.62),700,IMG.num);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(q,cx,cy+1);
    const name=p?(sn[p.id]||p.name):'未定';const fs=fitText(ctx,name,w*0.2,Math.round(r*0.78),700);
    const tw=ctx.measureText(name).width+fs*0.8;ctx.fillStyle='rgba(8,18,34,.78)';rr(ctx,cx-tw/2,cy+r+4,tw,fs*1.45,fs*0.35);ctx.fill();
    ctx.fillStyle=p?IMG.white:IMG.sub;ctx.textBaseline='middle';ctx.fillText(name,cx,cy+r+4+fs*0.75);
  });
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function changeLines(g,i){const d=diff(g,i);if(!d)return[];const nm=id=>{const p=byId(id);return p?p.name:'?';};const L=[];
  if(d.sys)L.push(['システム',`${SYS[g.segs[i-1].sys].label} → ${SYS[g.segs[i].sys].label}`,IMG.sub]);
  if(d.ins.length)L.push(['IN',d.ins.map(([id,q])=>`${nm(id)}（${q}）`).join('、'),IMG.ok]);
  if(d.outs.length)L.push(['OUT',d.outs.map(([id])=>nm(id)).join('、'),IMG.red]);
  if(d.moves.length)L.push(['位置変更',d.moves.map(([id,f,t])=>`${nm(id)} ${f}→${t}`).join('、'),IMG.sub]);
  if(!L.length)L.push(['変更','なし',IMG.sub]);return L;}
function header(ctx,W,title,sub1,sub2){
  ctx.fillStyle=IMG.navy;ctx.fillRect(0,0,W,ctx.canvas.height);
  ctx.fillStyle=IMG.sub;ft(ctx,28,700);ctx.fillText('東京都立大学サッカー部',60,74);
  ctx.fillStyle=IMG.white;fitText(ctx,title,W-120,58,700);ctx.fillText(title,60,148);
  ctx.fillStyle=IMG.sub;ft(ctx,30,400);if(sub1)ctx.fillText(sub1,60,198);if(sub2)ctx.fillText(sub2,60,240);
}
function drawLabelRows(ctx,rows,x,y,maxW,size){let yy=y;rows.forEach(([lab,text,col])=>{ft(ctx,size,700);const lw=ctx.measureText(lab).width+size*0.8;
  ctx.fillStyle=col;rr(ctx,x,yy-size*1.05,lw,size*1.45,size*0.3);ctx.fill();ctx.fillStyle=col===IMG.sub?IMG.navy:'#0B1A30';ctx.fillText(lab,x+size*0.4,yy);
  ft(ctx,size,400);ctx.fillStyle=IMG.white;const ls=wrapLines(ctx,text,maxW-lw-size*0.6);ls.forEach((l,k)=>{ctx.fillText(l,x+lw+size*0.6,yy+k*size*1.5);});yy+=Math.max(1,ls.length)*size*1.5+size*0.5;});return yy;}
function measureRows(ctx,rows,maxW,size){let h=0;rows.forEach(([lab,text])=>{ft(ctx,size,700);const lw=ctx.measureText(lab).width+size*0.8;ft(ctx,size,400);h+=Math.max(1,wrapLines(ctx,text,maxW-lw-size*0.6).length)*size*1.5+size*0.5;});return h;}
function segImage(g,i){
  const s=g.segs[i],W=1080,[a,b]=segRange(g,i),sn=snFor(gAll());const d=diff(g,i);const inSet=new Set(d?d.ins.map(x=>x[0]):[]);
  const playing=new Set(s.lineup.filter(Boolean));const bench=gParts().filter(p=>!playing.has(p.id)).map(p=>p.name);
  const rows=changeLines(g,i);if(bench.length)rows.push(['控え',bench.join('、'),IMG.sub]);
  const tmp=cv(10,10).getContext('2d');const rowsH=measureRows(tmp,rows,W-120,30);
  const pitchY=290,pitchH=980;const H=Math.round(pitchY+pitchH+40+rowsH+90);
  const c=cv(W,H),ctx=c.getContext('2d');
  header(ctx,W,`${g.opp?'vs '+g.opp:'練習試合'}`,`${fmtDate(g.date)}　練習試合　${perSummary(g)}`,`${segLabel(g,i)}（${b-a}分）　${SYS[s.sys].label}`);
  drawLineup(ctx,s,60,pitchY,W-120,pitchH,inSet,sn);
  drawLabelRows(ctx,rows,60,pitchY+pitchH+70,W-120,30);
  ctx.fillStyle=IMG.sub;ft(ctx,22,400);ctx.fillText('黄色の枠＝この区間から入った選手',60,H-36);
  return c;
}
function gameImage(g){
  const W=1080,colW=470,gap=40,x0=60,sn=snFor(gAll());const tmp=cv(10,10).getContext('2d');
  const blocks=g.segs.map((s,i)=>{const rows=i===0?[]:changeLines(g,i);return{s,i,rows,rh:measureRows(tmp,rows,colW,22)};});
  const pitchH=500,labelH=74;const rowsY=[];let y=300;
  for(let k=0;k<blocks.length;k+=2){rowsY.push(y);const h=Math.max(...blocks.slice(k,k+2).map(b=>labelH+pitchH+24+b.rh));y+=h+40;}
  const mins=minutesBy(g,-1);const pl=gAll().map(p=>({p,m:(mins[p.id]||{tot:0}).tot})).sort((a,b)=>b.m-a.m);
  const colsN=3,lineH=44;const minH=90+Math.ceil(pl.length/colsN)*lineH;const H=Math.round(y+minH+60);
  const c=cv(W,H),ctx=c.getContext('2d');
  const {total}=offs(g);header(ctx,W,`${g.opp?'vs '+g.opp:'練習試合'}`,`${fmtDate(g.date)}　練習試合`,`${perSummary(g)}（合計${total}分）`);
  blocks.forEach((bk,k)=>{const x=x0+(k%2)*(colW+gap),yy=rowsY[Math.floor(k/2)];const[a,b]=segRange(g,bk.i);const d=diff(g,bk.i);
    ctx.fillStyle=IMG.blue;ft(ctx,40,700,IMG.num);ctx.fillText(String(bk.i+1),x,yy+40);
    ctx.fillStyle=IMG.white;fitText(ctx,`${segLabel(g,bk.i)}（${b-a}分）`,colW-50,26,700);ctx.fillText(`${segLabel(g,bk.i)}（${b-a}分）`,x+40,yy+30);
    ctx.fillStyle=IMG.sub;ft(ctx,22,400);ctx.fillText(SYS[bk.s.sys].label,x+40,yy+60);
    drawLineup(ctx,bk.s,x,yy+labelH,colW,pitchH,new Set(d?d.ins.map(z=>z[0]):[]),sn);
    drawLabelRows(ctx,bk.rows,x,yy+labelH+pitchH+44,colW,22);});
  let yy=y+10;ctx.fillStyle=IMG.white;ft(ctx,32,700);ctx.fillText('出場時間',60,yy+30);yy+=80;
  pl.forEach((r,k)=>{const cx=60+(k%colsN)*((W-120)/colsN),cy=yy+Math.floor(k/colsN)*lineH;ctx.fillStyle=r.m?IMG.white:IMG.sub;ft(ctx,26,400);const nm=r.p.name;fitText(ctx,nm,200,26,400);ctx.fillText(nm,cx,cy);ft(ctx,30,700,IMG.num);ctx.fillStyle=r.m?IMG.white:IMG.sub;ctx.textAlign='right';ctx.fillText(r.m+"'",cx+(W-120)/colsN-30,cy);ctx.textAlign='left';});
  return c;
}
function posImage(){
  const W=1080,ps=state.players.filter(p=>!p.out&&!p.inj&&(scope==='all'||p.team===scope)).sort((a,b)=>(a.team||'Z').localeCompare(b.team||'Z')||(b.grade||0)-(a.grade||0)||sortP(a,b));const tmp=cv(10,10).getContext('2d');
  const rows=POS.map(q=>{const f=ps.filter(p=>p.p1===q),s=ps.filter(p=>p.p2===q);const nm=p=>`${scope==='all'&&p.team?p.team+' ':''}${p.name}（${p.grade}年）`;return{q,f,s,ft:f.map(nm).join('、')||'なし',st:s.map(nm).join('、')||'なし'};});
  const inner=W-120-140;ft(tmp,28,400);const rh=rows.map(r=>{ft(tmp,28,700);const a=wrapLines(tmp,r.ft,inner-120).length;ft(tmp,26,400);const b=wrapLines(tmp,r.st,inner-120).length;return 30+a*42+b*38+30;});
  const H=Math.round(290+rh.reduce((a,b)=>a+b,0)+80);const c=cv(W,H),ctx=c.getContext('2d');
  header(ctx,W,'ポジション別メンバー',`${scope==='all'?'全体':scope+'チーム'}　${SYS[state.system].label}`,`${ps.length}人（ケガ・対象外を除く）`);
  let y=290;rows.forEach((r,k)=>{ctx.fillStyle='rgba(255,255,255,.06)';rr(ctx,60,y,W-120,rh[k]-14,14);ctx.fill();
    ctx.fillStyle=IMG.white;ft(ctx,46,700,IMG.num);ctx.fillText(r.q,84,y+62);ctx.fillStyle=IMG.sub;ft(ctx,22,400);ctx.fillText(`1st ${r.f.length}・2nd ${r.s.length}`,84,y+94);
    let yy=y+48;const x=60+140+20;ctx.fillStyle=IMG.blue;ft(ctx,22,700);ctx.fillText('1st',x,yy);ft(ctx,28,700);ctx.fillStyle=IMG.white;wrapLines(ctx,r.ft,inner-120).forEach(l=>{ctx.fillText(l,x+60,yy);yy+=42;});
    ctx.fillStyle=IMG.sub;ft(ctx,22,700);ctx.fillText('2nd',x,yy);ft(ctx,26,400);ctx.fillStyle=IMG.sub;wrapLines(ctx,r.st,inner-120).forEach(l=>{ctx.fillText(l,x+60,yy);yy+=38;});
    y+=rh[k];});
  return c;
}
async function showImage(make,filename){
  try{await document.fonts.ready;}catch(e){}
  const c=make();const blob=await new Promise(r=>c.toBlob(r,'image/png'));const url=URL.createObjectURL(blob);
  const dl=await getDl();
  const d=modal(`<div class="shead"><b>画像で出力</b><button class="btn ghost sm" data-x>閉じる</button></div><div class="slist"><img src="${url}" alt="出力した画像" style="width:100%;border-radius:8px;display:block"></div><p class="note" id="im_msg">${dl?'「保存する」で端末に保存できます。スマホのアプリでは共有メニューからLINEなどに送れます。':'画像を長押し（パソコンでは右クリック）して保存してください。'}</p>${dl?'<div class="sfoot" style="justify-content:flex-end"><button class="btn" id="im_save">保存する</button></div>':''}`);
  d.querySelector('[data-x]').onclick=()=>{URL.revokeObjectURL(url);closeModal();};
  const sb=d.querySelector('#im_save');if(sb)sb.onclick=async()=>{try{await dl.save({filename,data:blob});d.querySelector('#im_msg').textContent='保存しました。';}catch(e){const m=d.querySelector('#im_msg');if(e&&e.code==='declined')m.textContent='保存をやめました。';else if(e&&e.code==='rate_limited')m.textContent='少し待ってからもう一度押してください。';else{m.textContent='この画面では保存できません。画像を長押しして保存してください。';sb.remove();}}};
}
function openImgMenu(g){

<button class="btn" data-img="seg">区間${cur+1}のメンバー（${esc(segLabel(g,cur))}）</button>
<button class="btn ghost" data-img="all">試合全体（全${g.segs.length}区間と出場時間）</button></div>`);

  const base=`${(g.date||'').replace(/-/g,'')}_${g.opp||'練習試合'}`.replace(/[\\/:*?"<>|\s]/g,'');

<section><h2>この区間で出ていない選手</h2><div class="chips">${bench.length?bench.map(p=>`<span class="mchip">${esc(p.name)}<small>${p.p1||'－'}</small></span>`).join(''):'<p class="note">全員出場しています。</p>'}</div></section></section>`;
}
function prevHtml(g,i){
  const before=minutesBefore(g,i),now=new Set(g.segs[i].lineup.filter(Boolean));
  const played=gAll().filter(p=>before[p.id]).sort((a,b)=>before[b.id]-before[a.id]||sortP(a,b));
  const none=gParts().filter(p=>!before[p.id]).sort(sortP);
  const per=minutesBy(g,-1,i);
  const brk=id=>{const x=per[id];return x?x.per.map((m,k)=>m?`${k+1}本${m}'`:null).filter(Boolean).join(' '):'';};
  return `<details class="prevbox"${prevOpen?' open':''}><summary>${startLabel(g.segs[i])} までの出場</summary>
<div class="prevp"><h4>出場した選手（多い順）</h4><div class="pchips">${played.map(p=>`<span class="pchip${now.has(p.id)?' now':''}">${esc(p.name)}<small>${brk(p.id)}</small></span>`).join('')||'<span class="note" style="margin:0">まだいません。</span>'}</div></div>
<div class="prevp"><h4>ここまで出場なし</h4><div class="pchips">${none.length?none.map(p=>`<span class="pchip${now.has(p.id)?' now':''}"><em>${p.p1||''}</em>${esc(p.name)}</span>`).join(''):'<span class="note" style="margin:0">全員出場済みです。</span>'}</div></div>
<p class="note">青く囲まれた選手は、この区間にも出ています。</p></details>`;
}
function bindSeg(g,i){
  const s=g.segs[i];
  document.querySelectorAll('[data-ssys]').forEach(b=>b.onclick=()=>{const sys=b.dataset.ssys;if(sys===s.sys)return;const old=SYS[s.sys].xy.map((x,k)=>[x[0],s.lineup[k]]).filter(x=>x[1]);s.sys=sys;const nx=SYS[sys].xy;s.lineup=nx.map(()=>'');const left=[];old.forEach(([q,id])=>{const k=nx.findIndex((z,j)=>z[0]===q&&!s.lineup[j]);if(k>=0)s.lineup[k]=id;else left.push(id);});left.forEach(id=>{const k=s.lineup.indexOf('');if(k>=0)s.lineup[k]=id;});touch();renderGame();});
  const cp=$('#s_copy');if(cp)cp.onclick=async()=>{const pv=g.segs[i-1];if(s.lineup.some(Boolean)&&s.lineup.join()!==pv.lineup.join()&&!await ask(`区間${i}（${segLabel(g,i-1)}）のメンバーとシステムで置き換えますか？`))return;s.sys=pv.sys;s.lineup=pv.lineup.slice();touch();renderGame();};
  $('#s_auto').onclick=async()=>{if(s.lineup.some(Boolean)&&!await ask('この区間のメンバーを置き換えて組みますか？'))return;autoSeg(g,i);};
  document.querySelectorAll('[data-sslot]').forEach(b=>b.onclick=()=>openSSlot(g,i,+b.dataset.sslot));
  const pb=document.querySelector('.prevbox');if(pb)pb.ontoggle=()=>{prevOpen=pb.open;};
  $('#s_next').onclick=()=>openSegTime(g,null,i);
  const tb=$('#s_time');if(tb)tb.onclick=()=>openSegTime(g,i);
  const db=$('#s_del');if(db)db.onclick=async()=>{if(!await ask(`区間${i+1}（${segLabel(g,i)}）を削除しますか？前の区間のメンバーがそのまま続きます。`))return;g.segs.splice(i,1);pt=Math.max(0,i-1);touch();renderGame();};
}
function openSegTime(g,editIdx,afterIdx){
  const cur=editIdx!=null?g.segs[editIdx]:null;
  let dp,dt;
  if(cur){dp=cur.p;dt=cur.t;}
  else{const base=g.segs[afterIdx!=null?afterIdx:g.segs.length-1];const nx=afterIdx!=null?g.segs[afterIdx+1]:null;
    dp=base.p;dt=Math.min(g.periods[base.p].min-1,base.t+Math.round(g.periods[base.p].min/2));
    if(nx&&(nx.p<dp||(nx.p===dp&&nx.t<=dt))){dp=base.p;dt=base.t+1;}}
  const d=modal(`<div class="shead"><b>${cur?'開始時点を変更':'メンバー変更を追加'}</b><button class="btn ghost sm" data-x>閉じる</button></div>
<div class="subform"><label>どの本から<select id="st_p">${g.periods.map((p,k)=>`<option value="${k}"${k===dp?' selected':''}>${k+1}本目（${p.min}分）</option>`).join('')}</select></label>
<label>何分から<span class="pmin"><input id="st_t" type="number" inputmode="numeric" min="0" value="${dt}">分　<small>0分＝その本の開始から</small></span></label>
<p class="note" id="st_prev" style="margin:0"></p><p class="err" id="st_err"></p>
<div class="sfoot" style="justify-content:flex-end"><button class="btn" id="st_ok">${cur?'変更する':'追加して編集する'}</button></div></div>`);
  const upd=()=>{const p=+$('#st_p').value,t=parseInt($('#st_t').value);$('#st_t').max=g.periods[p].min-1;
    if(!cur&&t>=0&&t<g.periods[p].min){const k=activeAt(g,p,t);$('#st_prev').textContent=`区間${k+1}（${segLabel(g,k)}）のメンバーを引き継いで作ります。`;}else $('#st_prev').textContent='';};
  upd();$('#st_p').onchange=upd;$('#st_t').oninput=upd;
  d.querySelector('[data-x]').onclick=closeModal;
  $('#st_ok').onclick=()=>{const p=+$('#st_p').value,t=parseInt($('#st_t').value),mx=g.periods[p].min;
    if(!(t>=0&&t<mx)){$('#st_err').textContent=`時間は0〜${mx-1}分で入力してください（${mx}分ちょうどは次の本の0分です）。`;return;}
    if(p===0&&t===0&&cur!==g.segs[0]){$('#st_err').textContent='1本目の開始は最初の区間です。';return;}
    if(g.segs.some(x=>x!==cur&&x.p===p&&x.t===t)){$('#st_err').textContent='その時点にはすでに区間があります。';return;}
    let target;
    if(cur){cur.p=p;cur.t=t;target=cur;}
    else{const k=activeAt(g,p,t),src=g.segs[k];target={p,t,sys:src.sys,lineup:src.lineup.slice()};g.segs.push(target);}
    g.segs.sort((a,b)=>a.p-b.p||a.t-b.t);pt=g.segs.indexOf(target);touch();closeModal();renderGame();
    const el=document.querySelector('.segedit');if(el)el.scrollIntoView({block:'start'});};
}
function autoSeg(g,i){
  const s=g.segs[i],mins=minutesBy(g,i),ps=gParts().slice(),xy=SYS[s.sys].xy;
  const key=p=>(mins[p.id]?mins[p.id].tot:0)+Math.random()*0.01;const lineup=xy.map(()=>'');const used=new Set();
  const pick=cond=>ps.filter(p=>!used.has(p.id)&&cond(p)).sort((a,b)=>key(a)-key(b))[0];
  POS.forEach(q=>xy.forEach(([z],k)=>{if(z!==q||lineup[k])return;const p=pick(p=>p.p1===q)||pick(p=>p.p2===q);if(p){lineup[k]=p.id;used.add(p.id);}}));
  xy.forEach(([z],k)=>{if(lineup[k])return;const p=pick(p=>z==='GK'||p.p1!=='GK');if(p){lineup[k]=p.id;used.add(p.id);}});
  s.lineup=lineup;touch();renderGame();
}
function openSSlot(g,i,k){
  const s=g.segs[i],q=SYS[s.sys].xy[k][0],cur=s.lineup[k],mins=minutesBy(g,i),prev=i>0?new Set(g.segs[i-1].lineup):new Set();
  const segLen=(()=>{const[a,b]=segRange(g,i);return b-a;})(),lim=g.maxMin||90;
  const over=id=>((mins[id]||{}).tot||0)+segLen>lim;
  const brk=id=>{const x=mins[id];const w=over(id)?`<b class="owarn">入れると上限${lim}分超え</b>`:'';if(!x||!x.tot)return'まだ出場なし'+w;return x.per.map((m,j)=>m?`${j+1}本${m}'`:null).filter(Boolean).join('・')+`（計${x.tot}'）`+w;return x.per.map((m,j)=>m?`${j+1}本${m}'`:null).filter(Boolean).join('・')+`（計${x.tot}'）`;};
  const row=p=>{const j=s.lineup.indexOf(p.id);return `<button class="prow${p.id===cur?' cur':''}" data-pid="${esc(p.id)}"><span>${p.team?`<i class="tb ${p.team}">${p.team}</i>`:''}${esc(p.name)} <small>${p.p1||'－'}${p.p2?'/'+p.p2:''}　${brk(p.id)}</small></span><em class="${j<0?'free':''}">${j<0?(prev.has(p.id)?'前の区間で出場':'控え'):'出場中 '+SYS[s.sys].xy[j][0]}</em></button>`;};
  const ps=gParts();
  const d=modal(`<div class="shead"><b>区間${i+1}　${q}</b><button class="btn ghost sm" data-x>閉じる</button></div>
<div class="slist">${[['f1',q+'が1st'],['f2',q+'が2nd'],['f0','その他']].map(([f,l])=>{const a=ps.filter(p=>fit(p,q)===f).sort((a,b)=>((mins[a.id]||{}).tot||0)-((mins[b.id]||{}).tot||0)||sortP(a,b));return a.length?`<h4>${l}（出場時間が少ない順）</h4>`+a.map(row).join(''):''}).join('')}</div>
${cur?'<div class="sfoot"><button class="btn ghost" data-clear>この枠を空ける</button></div>':''}`);
  d.querySelector('[data-x]').onclick=closeModal;
  d.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{const id=b.dataset.pid,j=s.lineup.indexOf(id);if(j>=0)s.lineup[j]=cur||'';s.lineup[k]=id;touch();closeModal();renderGame();});
  const c=d.querySelector('[data-clear]');if(c)c.onclick=()=>{s.lineup[k]='';touch();closeModal();renderGame();};
}
function openBulk(g){
  const gr=[];g.periods.forEach(p=>{const l=gr[gr.length-1];if(l&&l[0]===p.min)l[1]++;else gr.push([p.min,1]);});
  let rows=gr.length?gr:[[45,2]];
  const d=modal(`<div class="shead"><b>時間と本数</b><button class="btn ghost sm" data-x>閉じる</button></div><p class="note" style="margin:0 0 10px">上から順に1本目、2本目…となります。例：45分×2本、30分×1本。</p><div class="slist" id="bk_rows"></div><div class="sacts"><button class="btn ghost sm" id="bk_add">＋行を追加</button></div><p class="err" id="bk_err"></p><div class="sfoot" style="justify-content:flex-end"><button class="btn" id="bk_ok">この内容にする</button></div>`);
  const draw=()=>{$('#bk_rows').innerHTML=rows.map((r,i)=>`<div class="bkrow"><input type="number" inputmode="numeric" min="1" max="120" value="${r[0]}" data-bm="${i}"><span>分 ×</span><input type="number" inputmode="numeric" min="1" max="10" value="${r[1]}" data-bc="${i}"><span>本</span>${rows.length>1?`<button class="delbtn" data-br="${i}">削除</button>`:''}</div>`).join('');
    d.querySelectorAll('[data-bm]').forEach(x=>x.oninput=()=>rows[+x.dataset.bm][0]=parseInt(x.value)||0);
    d.querySelectorAll('[data-bc]').forEach(x=>x.oninput=()=>rows[+x.dataset.bc][1]=parseInt(x.value)||0);
    d.querySelectorAll('[data-br]').forEach(x=>x.onclick=()=>{rows.splice(+x.dataset.br,1);draw();});};
  draw();
  d.querySelector('[data-x]').onclick=closeModal;
  $('#bk_add').onclick=()=>{rows.push([30,1]);draw();};
  $('#bk_ok').onclick=async()=>{
    if(rows.some(r=>!(r[0]>=1&&r[0]<=120)||!(r[1]>=1&&r[1]<=10))){$('#bk_err').textContent='時間は1〜120分、本数は1〜10本で入力してください。';return;}
    const mins=[];rows.forEach(([m,c])=>{for(let i=0;i<c;i++)mins.push(m);});
    if(mins.length>12){$('#bk_err').textContent='合計12本までにしてください。';return;}
    const lost=g.segs.filter(s=>s.p>=mins.length&&!(s.p===0&&s.t===0));
    if(lost.length&&!await ask((mins.length+1)+'本目以降に始まる区間（'+lost.length+'つ）が消えます。よろしいですか？'))return;
    g.periods=mins.map(m=>({min:m}));pt=0;touch();closeModal();renderGame();};
}
function timeHtml(g,ps,fair){
  const lim=g.maxMin||90;
  const mins=minutesBy(g,-1);
  const rows=ps.map(p=>{const x=mins[p.id]||{per:g.periods.map(()=>0),tot:0};return{p,m:x.per,t:x.tot};}).sort((a,b)=>b.t-a.t||sortP(a.p,b.p));
  const mx=Math.max(1,fair,...rows.map(r=>r.t));
  return `<p class="note">均等に出す場合の目安は1人約${fair}分です。バーの黄色い線が目安の位置です。上限（${lim}分）を超えた選手は赤で表示します。</p>
<div class="card tbl"><table class="ttbl"><thead><tr><th>選手</th>${g.periods.map((x,k)=>`<th>${k+1}本</th>`).join('')}<th>計</th></tr></thead><tbody>
${rows.map(r=>`<tr class="${r.t===0?'zero':''}"><td><div class="tn">${esc(r.p.name)}<small>${r.p.p1||''}</small>${r.p.inj?'<i class="injtag">ケガ</i>':''}</div><div class="tbar"><span style="width:${r.t/mx*100}%"></span>${fair?`<i style="left:${Math.min(100,fair/mx*100)}%"></i>`:''}</div></td>${r.m.map(x=>`<td class="num${x?'':' dim'}">${x||'－'}</td>`).join('')}<td class="num${r.t>lim?' over':''}"><b>${r.t}</b></td></tr>`).join('')}
</tbody></table></div>`;
}
function gameText(){
  const g=G();let t=`練習試合${g.opp?' vs '+g.opp:''}（${fmtDate(g.date)}）${perSummary(g)}\n`;
  const nm=id=>{const p=byId(id);return p?p.name:'?';};
  g.segs.forEach((s,i)=>{const xy=SYS[s.sys].xy;const[a,b]=segRange(g,i);const d=diff(g,i);
    t+=`\n■${segLabel(g,i)}（${b-a}分）${SYS[s.sys].label}\n`;
    if(!d||d.sys||d.ins.length+d.moves.length>4){POS.forEach(q=>{const n=xy.map((z,k)=>z[0]===q?s.lineup[k]:null).filter(x=>x!==null);if(!n.length)return;t+=`${q}：${n.map(id=>id?nm(id):'（空き）').join('、')}\n`;});}
    if(d&&!d.sys&&!d.ins.length&&!d.outs.length&&!d.moves.length)t+='（変更なし）\n';
    if(d){if(d.ins.length)t+='IN：'+d.ins.map(([id,q])=>`${nm(id)}（${q}）`).join('、')+'\n';if(d.outs.length)t+='OUT：'+d.outs.map(([id])=>nm(id)).join('、')+'\n';if(d.moves.length)t+='位置変更：'+d.moves.map(([id,f,q])=>`${nm(id)} ${f}→${q}`).join('、')+'\n';}
  });
  const mins=minutesBy(g,-1);
  t+='\n■出場時間\n'+gAll().map(p=>({p,m:(mins[p.id]||{tot:0}).tot})).sort((a,b)=>b.m-a.m).map(r=>`${r.p.name} ${r.m}分`).join('\n')+'\n';
  return t;
}

function openPick(list,setList,title,done){
  let show='all';let sel=new Set(list);
  const d=modal(`<div class="shead"><b>${title} <span data-cnt class="num"></span></b><button class="btn ghost sm" data-x>完了</button></div>
<div class="seg" style="margin-bottom:8px">${[['A','Aチーム'],['B','Bチーム'],['all','全員']].map(([k,l])=>`<button data-show="${k}">${l}</button>`).join('')}</div>
<div class="sacts" style="margin-bottom:8px"><button class="btn ghost sm" data-allon>表示中を全員入れる</button><button class="btn ghost sm" data-alloff>表示中を全員外す</button></div><div class="slist"></div>`);
  const cnt=()=>state.players.filter(p=>sel.has(p.id)&&!p.inj).length+'人';
  const commit=()=>{const order=state.players.filter(p=>sel.has(p.id)).map(p=>p.id);setList(order);touch();d.querySelector('[data-cnt]').textContent=cnt();};
  const draw=()=>{const ps=state.players.filter(p=>!p.out&&(show==='all'||p.team===show)).sort(sortP);
    d.querySelector('.slist').innerHTML=ps.map(p=>p.inj?`<div class="prow inj"><span>${esc(p.name)} <small>${p.p1||'－'}</small></span><i class="injtag">ケガ</i></div>`:`<label class="prow"><span>${p.team?`<i class="tb ${p.team}">${p.team}</i>`:''}${esc(p.name)} <small>${p.grade?p.grade+'年':''}　${p.p1||'－'}</small></span><input type="checkbox" data-att="${esc(p.id)}"${sel.has(p.id)?' checked':''}></label>`).join('')||'<p class="note">該当する選手はいません。</p>';
    d.querySelectorAll('.seg [data-show]').forEach(b=>b.classList.toggle('on',b.dataset.show===show));
    d.querySelectorAll('[data-att]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.att):sel.delete(c.dataset.att);commit();});
    d.querySelector('[data-cnt]').textContent=cnt();};
  const fin=()=>{closeModal();done();};
  d.querySelector('[data-x]').onclick=fin;d.onclick=e=>{if(e.target===d)fin();};
  d.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{show=b.dataset.show;draw();});
  d.querySelector('[data-allon]').onclick=()=>{d.querySelectorAll('[data-att]').forEach(c=>sel.add(c.dataset.att));commit();draw();};
  d.querySelector('[data-alloff]').onclick=()=>{d.querySelectorAll('[data-att]').forEach(c=>sel.delete(c.dataset.att));commit();draw();};
  draw();
}

shell();renderTop();renderList();
setTab(tab==='game'?'game':'pos');
renderSave();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script></body></html>
